<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONESTOP Brochure</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .viewer {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .slides {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .slides::-webkit-scrollbar { display: none; }
    .page {
      min-width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .page img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 30px;
      cursor: pointer;
    }
    #prev { left: 14px; }
    #next { right: 14px; }
    .counter {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 14px;
    }
    @media (max-width: 768px) {
      .nav {
        width: 40px;
        height: 40px;
        font-size: 24px;
      }
      .page { padding: 6px; }
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="slides" id="slides">
      <div class="page"><img src="01.jpg" alt="1"></div>
      <div class="page"><img src="02.jpg" alt="2"></div>
      <div class="page"><img src="03.jpg" alt="3"></div>
      <div class="page"><img src="04.jpg" alt="4"></div>
      <div class="page"><img src="05.jpg" alt="5"></div>
      <div class="page"><img src="06.jpg" alt="6"></div>
      <div class="page"><img src="07.jpg" alt="7"></div>
      <div class="page"><img src="08.jpg" alt="8"></div>
    </div>

    <button class="nav" id="prev" aria-label="이전 페이지">‹</button>
    <button class="nav" id="next" aria-label="다음 페이지">›</button>

    <div class="counter"><span id="current">1</span> / 8</div>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const current = document.getElementById('current');

    function goNext() {
      slides.scrollBy({ left: slides.clientWidth, behavior: 'smooth' });
    }

    function goPrev() {
      slides.scrollBy({ left: -slides.clientWidth, behavior: 'smooth' });
    }

    document.getElementById('next').addEventListener('click', goNext);
    document.getElementById('prev').addEventListener('click', goPrev);

    slides.addEventListener('scroll', () => {
      const index = Math.round(slides.scrollLeft / slides.clientWidth);
      current.textContent = index + 1;
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
    });
  </script>
</body>
</html>
